
### PLUGINS (via TPM) ###
set -g @plugin 'tmux-plugins/tpm'

### GENERAL SETTINGS ###
set -g mouse on
setw -g mode-keys vi
set -g status-bg colour235  # dark gray
set -g status-fg colour51  # cyan

# Move around panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r means REPEATABLE — press prefix once, then keep pressing HJKL to keep resizing
# without -r, you'd need prefix every single time
# H/J/K/L (uppercase) resizes panes in steps of 5
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# Keep repeatable (-r) bindings active for 5 seconds
set -g repeat-time 5000

##### COPY MODE #####
# copy mode = tmux's "visual mode" — lets you scroll up and select text
# prefix+v enters copy mode (like pressing v to start visual in vim)
# prefix+[ also enters copy mode (tmux default — kept intentionally)
bind-key v copy-mode

# -T means TABLE — specifies which mode/context the key works in
# copy-mode-vi = inside copy mode with vim keys active
# without -T, the key would apply to normal prefix mode instead
# think of tables like vim modes: same key does different things in different contexts

# v: start character selection (like v in vim visual mode)
bind-key -T copy-mode-vi v send -X begin-selection
# V: start line selection (like V in vim)
bind-key -T copy-mode-vi V send -X select-line

# Use system clipboard
# sudo apt install xsel
set-option -g set-clipboard on

# y: yank (copy) selection — does NOT jump to bottom of terminal
# normally tmux jumps to bottom after copy, "copy-selection" without "-and-cancel" prevents that
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xsel --clipboard --input"

# q/Escape/Ctrl-c: exit copy mode without copying (like Escape in vim)
bind-key -T copy-mode-vi Escape send -X clear-selection
bind-key -T copy-mode-vi q      send -X clear-selection
bind-key -T copy-mode-vi C-c    send -X clear-selection

### Shortcut (Optional Custom Binding) ###
bind y setw synchronize-panes

#<<< Tmux-Menus >>>
# https://github.com/jaclu/tmux-menus
set -g @plugin 'jaclu/tmux-menus' # <prefix> \
#<<< Tmux-Menus >>>

# Set status-left in one line
set -g status-left "#h | #S"

# Set status-right in one line
set -g status-right "%b %d %I:%M %p"

# ncrease Display Time for Ctrl + b q
set -g display-panes-time 3000 # 3 seconds

# Set window index to start from 1
set -g base-index 1
setw -g pane-base-index 1

### LOAD TPM (keep this at the end!) ###
run '~/.tmux/plugins/tpm/tpm'

