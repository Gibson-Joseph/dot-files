############################################################
# TMUX CONFIGURATION
############################################################

###############################
# COLOR VARIABLES
###############################
set -g @color_bg_main colour235
set -g @color_fg_main colour51
set -g @color_accent colour46
set -g @color_text colour255
set -g @color_border colour238
set -g @color_active_border colour46

###############################
# PLUGINS (TPM)
###############################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jaclu/tmux-menus'   # Prefix + \


###############################
# CORE SETTINGS
###############################
set -g mouse on
setw -g mode-keys vi

# Clipboard integration
set -g set-clipboard on


###############################
# PANE NAVIGATION (VIM STYLE)
###############################
# Move between panes using hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


###############################
# PANE RESIZING
###############################
# -r makes bindings repeatable
# Allows resizing continuously after pressing prefix once
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# Keep repeatable bindings active for 5 seconds
set -g repeat-time 5000


###############################
# PANE SPLITTING (KEEP CURRENT PATH)
###############################
# Keep default tmux keys but open panes in same directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"


###############################
# COPY MODE (VIM STYLE)
###############################
# Enter copy mode
bind-key v copy-mode

# Visual selection
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Yank selection to system clipboard
# Requires: sudo apt install xsel
bind-key -T copy-mode-vi y send -X copy-pipe "xsel --clipboard --input"

# Exit copy mode
bind-key -T copy-mode-vi Escape send -X clear-selection
bind-key -T copy-mode-vi q      send -X clear-selection
bind-key -T copy-mode-vi C-c    send -X clear-selection


###############################
# PANE UTILITIES
###############################
# Toggle synchronized panes (send same input to all panes)
bind y setw synchronize-panes


###############################
# CONFIGURATION UTILITIES
###############################
# Reload tmux configuration without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"


###############################
# STATUS BAR
###############################
set -g status-bg #{@color_bg_main}
set -g status-fg #{@color_fg_main}

# Left side: Host | Session
set -g status-left " #h |  #S"
set -g status-left-length 200

# Center alignment
set -g status-justify centre # Window list will be centered

# Right side: Date + Time
set -g status-right "󱑂 %b %d %I:%M %p"
set -g status-right-length 200

# Window Status Style
setw -g window-status-current-style "fg=#{@color_accent},bold"
setw -g window-status-style "fg=#{@color_text}"

setw -g window-status-current-format " #I:#W"
setw -g window-status-format " #I:#W"


###############################
# WINDOW & PANE INDEXING
###############################
# Start numbering from 1 instead of 0
set -g base-index 1 # Windows start from 1
set -g pane-base-index 1 # Panes start from 1

# Auto renumber windows after closing
set -g renumber-windows on


###############################
# DISPLAY SETTINGS
###############################
# Increase pane number display time (prefix + q)
set -g display-panes-time 3000

# Pane border styling
set -g pane-border-style "fg=#{@color_border}"
set -g pane-active-border-style "fg=#{@color_active_border}"

# Clock mode format (12 hour)
# set -g clock-mode-style 12 


###############################
# LOAD TPM (KEEP AT END)
###############################
run '~/.tmux/plugins/tpm/tpm'
